<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="style.css">
    <title>Podometer</title>
</head>
<body id="body">
    <nav>
        <div class="left">
            <strong>Nico's</strong> podometer app
        </div>

        <div class="right">
            <a href="#"><i class="fa-solid fa-circle-user"></i></a>
        </div>
    </nav>

    <main>

        <h1>Podometer App</h1>

        <section class="appSection">
            <div class="appContainer">
                <h2>Steps</h2>
                <span id="stepsCount">0</span>
            </div>
        </section>

        <div class="objetiveContainer">

            <div class="objetiveHeader">
                <h2>Objetives</h2>
                <div class="optionsWrapper">
                    <button class="moreOptions" id="moreOptions"><i class="fa-solid fa-ellipsis-vertical"></i></button>

                    <div class="optionsMenu windowHidden" id="optionsMenu">
                        <button id="clearObjectives"><i class="fa-solid fa-trash"></i> Delete all objectives</button>
                    </div>
                </div>
            </div>

            <div id="cardsContainer" class="windowHidden"></div>

            <div class="addBtnContainer">
                <button class="addObjetive" id="addObjetive">
                    <i class="fa-solid fa-plus"></i> Add Objetives
                </button>
            </div>

            <div class="goalWindow windowHidden" id="goalWindow">
                <div class="goalWindowContent">
                    <input type="text" placeholder="What are you working on?" class="inputTitle" id="inputTitle">
                    <div class="goalInfo">
                        <h3>Steps Goal</h3>
                        <input type="number" class="no-arrows" min="0" id="inputSteps" placeholder="0">
                    </div>
                    <div class="btnContainer">
                        <button id="cancelBtn">Cancel</button>
                        <button id="saveBtn">Save</button>
                    </div>
                </div>
            </div>

        </div>
        <!--
        <p id="sensorStatus"></p>
        -->
    </main>
    
    <script src="script.js" type="module"></script>
    <script src="objetives.js"></script>
</body>
</html>
